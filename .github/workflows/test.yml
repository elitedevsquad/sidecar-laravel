name: Tests

on:
  push:
    branches:
      - "**"
    paths-ignore:
        - "README.md"

  pull_request:
    types: [ ready_for_review, synchronize, opened ]
    paths-ignore:
      - "README.md"

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        php-version: [ 8.5, 8.4, 8.3, 8.2 ]
        laravel-version: [ 13.*, 12.*, 11.* ]
        exclude:
          - php-version: 8.5
            laravel-version: 11.*
          - php-version: 8.2
            laravel-version: 13.*
      fail-fast: false

    name: PHP:${{ matrix.php-version }} / L:${{ matrix.laravel-version }}

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: ci
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

      redis:
        image: redis
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: fileinfo, dom, curl, libxml, mbstring, bcmath
          coverage: xdebug
          tools: composer:v2

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.x"
          cache: "pnpm"

      - name: Install JS Dependencies
        run: pnpm install

      - name: Build
        run: pnpm build

      - name: Install Dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel-version }}" --no-interaction --no-update
          composer install --no-security-blocking

      - name: Pint - Code Style Fixer
        if: matrix.php-version == '8.3'
        run: composer test:lint

      - name: Prevent debug call
        run: composer test:debug

      - name: Type Checks
        run: composer test:types

      - name: Pest - Run Tests
        run: composer test:unit
